name: Ролик с фактами

on:
  schedule:
    # Время в UTC. 7, 12, 17 UTC = 10:00, 15:00, 20:00 по Москве
    - cron: "0 7,12,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Что сделать"
        type: choice
        options:
          - video
          - voices
        default: video

permissions:
  contents: write

concurrency: factbot

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      SPEECHKIT_API_KEY: ${{ secrets.SPEECHKIT_API_KEY }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      MODE: ${{ github.event.inputs.mode || 'video' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'silero' }}
      VOICE: ${{ vars.VOICE || 'aidar' }}
      VOICE_SPEED: ${{ vars.VOICE_SPEED || '1.0' }}
      VOICE_PITCH: ${{ vars.VOICE_PITCH || '0.9' }}
      VOICE_POST_PITCH: ${{ vars.VOICE_POST_PITCH || '1.0' }}
      VOICE_PRESET: ${{ vars.VOICE_PRESET || 'studio' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Кэш npm и голосов
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            models
          key: factbot-${{ hashFiles('package.json') }}-v3

      - name: Установка Remotion
        if: env.MODE == 'video'
        run: npm install --no-audit --no-fund && npx remotion browser ensure

      - name: Установка Python-библиотек
        run: pip install -r requirements.txt

      - name: Установка голосов (Silero и Piper)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install piper-tts onnxruntime
          mkdir -p models
          [ -s models/silero_ru.pt ] || curl -fL -o models/silero_ru.pt https://models.silero.ai/models/tts/ru/v4_ru.pt || rm -f models/silero_ru.pt
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium
          [ -s models/dmitri.onnx ] || curl -fL -o models/dmitri.onnx $BASE/ru_RU-dmitri-medium.onnx || rm -f models/dmitri.onnx
          [ -s models/dmitri.onnx.json ] || curl -fL -o models/dmitri.onnx.json $BASE/ru_RU-dmitri-medium.onnx.json || rm -f models/dmitri.onnx.json
          ls -la models

      - name: Тест голосов
        if: env.MODE == 'voices'
        run: python voices.py

      - name: Создание ролика
        if: env.MODE == 'video'
        run: python run.py

      - name: Сохранение очереди
        if: env.MODE == 'video'
        run: |
          git config user.name "factbot"
          git config user.email "factbot@users.noreply.github.com"
          git add -A queue done.txt
          git diff --cached --quiet || (git commit -m "Использован сценарий" && git push)

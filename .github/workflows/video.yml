name: Ролик с фактами

on:
  schedule:
    # Время в UTC. 6:17, 11:17, 16:17 UTC = 9:17, 14:17, 19:17 по Москве (не ровно в :00 — меньше задержек)
    - cron: "17 6,11,16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Что сделать"
        type: choice
        options:
          - video
          - voices
          - pilot
        default: video

permissions:
  contents: write

concurrency: factbot

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      SPEECHKIT_API_KEY: ${{ secrets.SPEECHKIT_API_KEY }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      MODE: ${{ github.event.inputs.mode || 'video' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'edge' }}
      YANDEX_VOICE: ${{ vars.YANDEX_VOICE || 'madirus' }}
      YANDEX_EMOTION: ${{ vars.YANDEX_EMOTION || 'none' }}
      YANDEX_SPEED: ${{ vars.YANDEX_SPEED || '1.05' }}
      EDGE_VOICE: ${{ vars.EDGE_VOICE || 'ru-RU-DmitryNeural' }}
      EDGE_RATE: ${{ vars.EDGE_RATE || '+6%' }}
      EDGE_PITCH: ${{ vars.EDGE_PITCH || '-2Hz' }}
      VOICE: ${{ vars.VOICE || 'eugene' }}
      VOICE_SPEED: ${{ vars.VOICE_SPEED || '1.0' }}
      VOICE_PITCH: ${{ vars.VOICE_PITCH || '1.0' }}
      VOICE_TEMPO: ${{ vars.VOICE_TEMPO || '0.96' }}
      VOICE_POST_PITCH: ${{ vars.VOICE_POST_PITCH || '1.0' }}
      VOICE_PRESET: ${{ vars.VOICE_PRESET || 'smooth' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка ffmpeg
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && \
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core && break
            echo "Зеркало тормозит, пробую ещё раз ($i)"; sleep 10
          done

      - name: Кэш npm и голосов
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            models
          key: factbot-${{ hashFiles('package.json') }}-v3

      - name: Установка Remotion
        if: env.MODE == 'video' || env.MODE == 'pilot'
        run: npm install --no-audit --no-fund && npx remotion browser ensure

      - name: Запасной ffmpeg (из Remotion), если зеркало apt не ответило
        if: env.MODE == 'video' || env.MODE == 'pilot'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            printf '#!/bin/sh\nexec npx --no-install remotion ffmpeg "$@"\n' | sudo tee /usr/local/bin/ffmpeg >/dev/null
            sudo chmod +x /usr/local/bin/ffmpeg
            echo "Системного ffmpeg нет — использую встроенный в Remotion"
          fi
          ffmpeg -version | head -1

      - name: Установка Python-библиотек
        run: pip install -r requirements.txt

      - name: Установка голосов (Silero и Piper)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install piper-tts onnxruntime
          mkdir -p models
          [ -s models/silero_ru.pt ] || curl -fL -o models/silero_ru.pt https://models.silero.ai/models/tts/ru/v4_ru.pt || rm -f models/silero_ru.pt
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium
          [ -s models/dmitri.onnx ] || curl -fL -o models/dmitri.onnx $BASE/ru_RU-dmitri-medium.onnx || rm -f models/dmitri.onnx
          [ -s models/dmitri.onnx.json ] || curl -fL -o models/dmitri.onnx.json $BASE/ru_RU-dmitri-medium.onnx.json || rm -f models/dmitri.onnx.json
          ls -la models

      - name: Тест голосов
        if: env.MODE == 'voices'
        run: python voices.py

      - name: Создание ролика
        if: env.MODE == 'video' || env.MODE == 'pilot'
        run: python run.py

      - name: Сохранение очереди
        if: env.MODE == 'video'
        run: |
          git config user.name "factbot"
          git config user.email "factbot@users.noreply.github.com"
          git add -A queue done.txt cover_number.txt
          git diff --cached --quiet || git commit -m "Использован сценарий"
          # если пока шёл рендер в репозиторий что-то залили — подтягиваем и пробуем снова
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
